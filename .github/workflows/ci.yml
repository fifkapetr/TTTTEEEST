name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:report

      - name: Build
        run: npm run build

      - name: Publish test overview
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const summaryPath = process.env.GITHUB_STEP_SUMMARY
          const testResultsPath = 'reports/test-results.json'
          const coveragePath = 'reports/coverage/coverage-summary.json'
          
          let summary = '## Test Overview\n'
          
          if (fs.existsSync(testResultsPath)) {
            try {
              const results = JSON.parse(fs.readFileSync(testResultsPath, 'utf8'))
              const durationMs = (results.testResults ?? [])
                .map(suite => suite.endTime - suite.startTime)
                .filter(value => Number.isFinite(value))
                .reduce((total, value) => total + value, 0)
              summary += `\n- Suites: ${results.numPassedTestSuites ?? 0}/${results.numTotalTestSuites ?? 0} passed`
              summary += `\n- Tests: ${results.numPassedTests ?? 0}/${results.numTotalTests ?? 0} passed`
              summary += `\n- Duration: ${Math.round(durationMs) / 1000}s`
            } catch {
              summary += '\n- Test result JSON could not be parsed.'
            }
          } else {
            summary += '\n- Test result JSON was not generated.'
          }
          
          if (fs.existsSync(coveragePath)) {
            try {
              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8')).total
              summary += '\n\n## Coverage Overview'
              summary += `\n- Lines: ${coverage.lines.pct}%`
              summary += `\n- Functions: ${coverage.functions.pct}%`
              summary += `\n- Statements: ${coverage.statements.pct}%`
              summary += `\n- Branches: ${coverage.branches.pct}%`
            } catch {
              summary += '\n\n## Coverage Overview\n- Coverage summary could not be parsed.'
            }
          } else {
            summary += '\n\n## Coverage Overview\n- Coverage summary was not generated.'
          }
          
          fs.appendFileSync(summaryPath, `${summary}\n`)
          NODE

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/test-report.html
            reports/test-results.json
            reports/coverage
